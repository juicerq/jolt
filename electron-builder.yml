appId: com.jolt.app
productName: Jolt
directories:
  output: release
files:
  - out/**
  - resources/icon.png
  - package.json
  - "!node_modules/**"
  - node_modules/argparse/**
  - node_modules/builder-util-runtime/**
  - node_modules/debug/**
  - node_modules/electron-updater/**
  - node_modules/fs-extra/**
  - node_modules/graceful-fs/**
  - node_modules/js-yaml/**
  - node_modules/jsonfile/**
  - node_modules/lazy-val/**
  - node_modules/lodash.escaperegexp/**
  - node_modules/lodash.isequal/**
  - node_modules/ms/**
  - node_modules/sax/**
  - node_modules/semver/**
  - node_modules/tiny-typed-emitter/**
  - node_modules/universalify/**
  - node_modules/zod/**
extraResources:
  - from: dist-engine
    to: engine
npmRebuild: false
publish:
  provider: github
  owner: juicerq
  repo: jolt
  releaseType: release
linux:
  extraResources:
    - from: node_modules/agent-browser/bin
      to: browser-driver
      filter:
        - agent-browser-linux-${arch}*
  target: AppImage
  executableName: jolt
  category: Development
  synopsis: Times de Bots que trabalham no seu computador
  syncDesktopName: true
  icon: resources/icon.png
mac:
  extraResources:
    - from: node_modules/agent-browser/bin
      to: browser-driver
      filter:
        - agent-browser-darwin-${arch}*
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  icon: resources/icon.png
  identity: null
win:
  extraResources:
    - from: node_modules/agent-browser/bin
      to: browser-driver
      filter:
        - agent-browser-win32-${arch}*
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
