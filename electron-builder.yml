appId: com.jolt.app
productName: Jolt
directories:
  output: release
files:
  - out/**
  - resources/icon.png
  - package.json
  - "!node_modules/**"
  - node_modules/zod/**
extraResources:
  - from: dist-engine
    to: engine
npmRebuild: false
linux:
  target: AppImage
  executableName: jolt
  category: Development
  synopsis: Times de Bots que trabalham no seu computador
  syncDesktopName: true
  icon: resources/icon.png
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  icon: resources/icon.png
  identity: null
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
